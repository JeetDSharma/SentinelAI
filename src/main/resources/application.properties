spring.application.name=sentinel

# --- PostgreSQL (docker-compose maps container 5432 -> host 5433) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/sentinel
spring.datasource.username=sentinel
spring.datasource.password=sentinel

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Do not keep a DB connection/session open for the whole HTTP request (avoids hidden lazy-loading in controllers).
spring.jpa.open-in-view=false
# Load lazy collections for up to 50 parents in one IN (...) query instead of one query each (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Elasticsearch ---
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=5s

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# --- Sentinel ---
sentinel.watchlist.index=watchlist
# Rebuild the index from src/main/resources/elasticsearch/*.json at startup (idempotent)
sentinel.watchlist.seed-on-startup=true
# Candidates scoring below this are not shown to the analyst
sentinel.screening.min-score=50
